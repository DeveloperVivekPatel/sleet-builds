name: Build

# Builds from the live code in airwix_erp_v2 (nothing is copied into this repo):
# - Sleet Tally Connector (connector/) and Sleet Server Setup (installer/): Windows exes, published in this repo's Releases
# - the offline edition image (deploy/offline/offline.Dockerfile): pushed to ghcr.io
on:
  workflow_dispatch:
    inputs:
      what:
        description: What to build
        type: choice
        options: [tally-connector, server-setup, offline-image, all]
        default: tally-connector
      version:
        description: Version number (e.g. 1.0.0)
        type: string
        default: 1.0.0
      erp_ref:
        description: Branch or commit of airwix_erp_v2 to build from
        type: string
        default: main

permissions:
  contents: write
  packages: write

env:
  ERP_REPO: VatsalSutariyaDeveloper/airwix_erp_v2
  SLEET_CLOUD_URL: ${{ vars.SLEET_CLOUD_URL || 'https://app.getsleet.cloud/api' }}

jobs:
  tally-connector:
    if: inputs.what == 'tally-connector' || inputs.what == 'all'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Get airwix_erp_v2
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ERP_REPO }}
          ref: ${{ inputs.erp_ref }}
          token: ${{ secrets.ERP_REPO_TOKEN }}
          path: erp
          sparse-checkout: connector

      - uses: actions/setup-go@v5
        with:
          go-version: 1.24.0
          cache-dependency-path: erp/connector/go.sum

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      - name: Test
        working-directory: erp/connector
        run: go test ./...

      - name: Build SleetTallyConnector.exe
        working-directory: erp/connector
        env:
          SLEET_VERSION: ${{ inputs.version }}
          GOTOOLCHAIN: local
        run: WAILS="$(go env GOPATH)/bin/wails.exe" ./build.sh

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tally-connector-v${{ inputs.version }}
          name: Sleet Tally Connector ${{ inputs.version }}
          body: Built from ${{ env.ERP_REPO }} ${{ inputs.erp_ref }}, for ${{ env.SLEET_CLOUD_URL }}.
          files: erp/connector/build/bin/SleetTallyConnector.exe
          make_latest: false

      - name: Publish as the fixed download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tally-connector-latest
          name: Sleet Tally Connector (latest)
          body: Always the newest build. Download link stays the same.
          files: erp/connector/build/bin/SleetTallyConnector.exe
          make_latest: false

  server-setup:
    if: inputs.what == 'server-setup' || inputs.what == 'all'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Get airwix_erp_v2
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ERP_REPO }}
          ref: ${{ inputs.erp_ref }}
          token: ${{ secrets.ERP_REPO_TOKEN }}
          path: erp
          sparse-checkout: |
            installer
            deploy/offline

      - name: Check the Setup screen files are in the repo
        run: |
          if [ ! -f erp/installer/frontend/dist/index.html ]; then
            echo "::error::installer/frontend/dist is not in airwix_erp_v2 (the root .gitignore drops dist). Add it with: git add -f installer/frontend/dist"
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version: 1.24.0
          cache-dependency-path: erp/installer/go.sum

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      - name: Build SleetServerSetup.exe
        working-directory: erp/installer
        env:
          SLEET_VERSION: ${{ inputs.version }}
          SLEET_MANIFEST_URL: ${{ vars.SLEET_MANIFEST_URL }}
          SLEET_MANIFEST_KEY: ${{ vars.SLEET_MANIFEST_KEY }}
          SLEET_REPORT_URL: ${{ vars.SLEET_REPORT_URL }}
          GOTOOLCHAIN: local
        run: WAILS="$(go env GOPATH)/bin/wails.exe" ./build.sh

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: server-setup-v${{ inputs.version }}
          name: Sleet Server Setup ${{ inputs.version }}
          body: Built from ${{ env.ERP_REPO }} ${{ inputs.erp_ref }}, for ${{ env.SLEET_CLOUD_URL }}.
          files: erp/installer/build/bin/SleetServerSetup.exe
          make_latest: false

      - name: Publish as the fixed download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: server-setup-latest
          name: Sleet Server Setup (latest)
          body: Always the newest build. Download link stays the same.
          files: erp/installer/build/bin/SleetServerSetup.exe
          make_latest: false

  offline-image:
    if: inputs.what == 'offline-image' || inputs.what == 'all'
    runs-on: ubuntu-latest
    steps:
      - name: Get airwix_erp_v2
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ERP_REPO }}
          ref: ${{ inputs.erp_ref }}
          token: ${{ secrets.ERP_REPO_TOKEN }}
          path: erp

      - name: Check the licence key is set
        run: |
          if [ -z "${{ vars.LICENSE_PUBLIC_KEY }}" ]; then
            echo "::error::Set the repository variable LICENSE_PUBLIC_KEY (the public half from scripts/offline-license.js keys)"
            exit 1
          fi

      - name: Generate permissions from the production API
        working-directory: erp
        env:
          PERMS_API_URL: https://app.getsleet.cloud
        run: |
          for attempt in 1 2 3; do
            timeout 25 node apps/backend/scripts/generateModuleConstants.js && exit 0
            echo "::warning::permissions fetch attempt $attempt failed"
            sleep 5
          done
          echo "::error::Could not fetch the permissions from the production API after 3 tries"
          exit 1

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sleet-offline" >> "$GITHUB_OUTPUT"

      - name: Build and push the offline image
        uses: docker/build-push-action@v6
        with:
          context: erp
          file: erp/deploy/offline/offline.Dockerfile
          push: true
          build-args: |
            LICENSE_PUBLIC_KEY=${{ vars.LICENSE_PUBLIC_KEY }}
            SLEET_CLOUD_URL=${{ env.SLEET_CLOUD_URL }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ inputs.version }}
            ${{ steps.image.outputs.name }}:latest
