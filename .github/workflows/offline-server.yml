name: Offline Server
run-name: Offline Server ${{ inputs.version }} #${{ inputs.release_id || 'manual' }}

# Builds a full offline edition release from the live airwix_erp_v2 code, the same five parts installer/README.md lists:
# sleet-app.tar (deploy/offline/offline.Dockerfile), sleet-linux.tar.gz (installer/linux), postgres.tar, caddy.tar and
# wsl.x64.msi, plus the signed download list manifest.json and SleetServerSetup.exe (installer/). Everything goes to the
# Release "offline-server-v<version>". With publish on, manifest.json and the exe also go to the fixed "offline-server-latest",
# which Setup and every installed server's update agent read, so the servers are offered this version.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version number (e.g. 1.0.0)
        type: string
        required: true
      erp_ref:
        description: Branch or commit of airwix_erp_v2 to build from
        type: string
        default: main
      publish:
        description: Offer this version to Setup and the installed servers (offline-server-latest)
        type: boolean
        default: true
      release_id:
        description: App Version row id (filled in when Sleet starts the build)
        type: string
        default: ""

permissions:
  contents: write

env:
  ERP_REPO: VatsalSutariyaDeveloper/airwix_erp_v2
  SLEET_CLOUD_URL: ${{ vars.SLEET_CLOUD_URL || 'https://app.getsleet.cloud/api' }}
  RELEASE_TAG: offline-server-v${{ inputs.version }}

jobs:
  parts:
    runs-on: ubuntu-latest
    steps:
      - name: Check the keys are set
        env:
          MANIFEST_PRIVATE_KEY: ${{ secrets.OFFLINE_MANIFEST_PRIVATE_KEY }}
        run: |
          [ -n "${{ vars.LICENSE_PUBLIC_KEY }}" ] || { echo "::error::Set the variable LICENSE_PUBLIC_KEY (public licence key, base64)"; exit 1; }
          [ -n "$MANIFEST_PRIVATE_KEY" ] || { echo "::error::Set the secret OFFLINE_MANIFEST_PRIVATE_KEY (manifest-private.key from scripts/offline-manifest.js keys)"; exit 1; }

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      - name: Get airwix_erp_v2
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ERP_REPO }}
          ref: ${{ inputs.erp_ref }}
          token: ${{ secrets.ERP_REPO_TOKEN }}
          path: erp

      - name: Generate permissions from the production API
        working-directory: erp
        env:
          PERMS_API_URL: https://app.getsleet.cloud
        run: |
          for attempt in 1 2 3; do
            timeout 25 node apps/backend/scripts/generateModuleConstants.js && exit 0
            echo "::warning::permissions fetch attempt $attempt failed"
            sleep 5
          done
          echo "::error::Could not fetch the permissions from the production API after 3 tries"
          exit 1

      - name: App image (sleet-app.tar)
        run: |
          mkdir -p out
          docker build -f erp/deploy/offline/offline.Dockerfile \
            --build-arg LICENSE_PUBLIC_KEY="${{ vars.LICENSE_PUBLIC_KEY }}" \
            --build-arg SLEET_CLOUD_URL="$SLEET_CLOUD_URL" \
            -t sleet-offline:${{ inputs.version }} erp
          docker save -o out/sleet-app.tar sleet-offline:${{ inputs.version }}
          docker image rm sleet-offline:${{ inputs.version }} && docker builder prune -af

      - name: Linux system (sleet-linux.tar.gz)
        run: |
          docker build -t sleet-linux erp/installer/linux
          docker create --name sleet-linux-export sleet-linux
          docker export sleet-linux-export | gzip > out/sleet-linux.tar.gz
          docker rm sleet-linux-export

      - name: Database and web server (postgres.tar, caddy.tar)
        run: |
          docker pull postgres:16 && docker save -o out/postgres.tar postgres:16
          docker pull caddy:2 && docker save -o out/caddy.tar caddy:2

      - name: WSL package (wsl.x64.msi)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo microsoft/WSL --pattern '*.x64.msi' --dir wsl
          mv wsl/*.x64.msi out/wsl.x64.msi

      - name: Signed download list (manifest.json)
        env:
          MANIFEST_PRIVATE_KEY: ${{ secrets.OFFLINE_MANIFEST_PRIVATE_KEY }}
        run: |
          node -e '
            const fs = require("fs"), crypto = require("crypto");
            const files = ["wsl.x64.msi", "sleet-linux.tar.gz", "sleet-app.tar", "postgres.tar", "caddy.tar"];
            const list = files.map((file) => {
              const data = fs.readFileSync("out/" + file);
              return { file, size: data.length, sha256: crypto.createHash("sha256").update(data).digest("hex") };
            });
            fs.writeFileSync("hashes.json", JSON.stringify(list));'
          key="$RUNNER_TEMP/manifest-private.key"
          printf '%s\n' "$MANIFEST_PRIVATE_KEY" > "$key"
          node erp/scripts/offline-manifest.js sign "$key" "${{ inputs.version }}" hashes.json \
            "https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG" out/manifest.json
          rm -f "$key"

      - name: Publish the parts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Sleet Server ${{ inputs.version }}
          body: Offline edition built from ${{ env.ERP_REPO }} ${{ inputs.erp_ref }}, for ${{ env.SLEET_CLOUD_URL }}.
          files: out/*
          make_latest: false

      - uses: actions/upload-artifact@v4
        with:
          name: manifest
          path: out/manifest.json

  setup:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Get airwix_erp_v2
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ERP_REPO }}
          ref: ${{ inputs.erp_ref }}
          token: ${{ secrets.ERP_REPO_TOKEN }}
          path: erp
          sparse-checkout: |
            installer
            deploy/offline

      - name: Check the Setup screen files are in the repo
        run: |
          [ -f erp/installer/frontend/dist/index.html ] || { echo "::error::installer/frontend/dist is missing in airwix_erp_v2"; exit 1; }
          [ -n "${{ vars.SLEET_MANIFEST_KEY }}" ] || { echo "::error::Set the variable SLEET_MANIFEST_KEY (public key of the download list)"; exit 1; }

      - uses: actions/setup-go@v5
        with:
          go-version: 1.24.0
          cache-dependency-path: erp/installer/go.sum

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      - name: Build SleetServerSetup.exe
        working-directory: erp/installer
        env:
          SLEET_VERSION: ${{ inputs.version }}
          SLEET_MANIFEST_URL: https://github.com/${{ github.repository }}/releases/download/offline-server-latest/manifest.json
          SLEET_MANIFEST_KEY: ${{ vars.SLEET_MANIFEST_KEY }}
          SLEET_REPORT_URL: ${{ vars.SLEET_REPORT_URL }}
          GOTOOLCHAIN: local
        run: WAILS="$(go env GOPATH)/bin/wails.exe" ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: setup
          path: erp/installer/build/bin/SleetServerSetup.exe

  publish:
    needs: [parts, setup]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true

      - name: Add Setup to this version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: files/SleetServerSetup.exe
          make_latest: false

      - name: Offer this version (offline-server-latest)
        if: inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: offline-server-latest
          name: Sleet Server (latest)
          body: The download list and Setup of the version offered to new and installed offline servers.
          files: |
            files/manifest.json
            files/SleetServerSetup.exe
          make_latest: false
